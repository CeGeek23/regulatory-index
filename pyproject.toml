[project]
name = "regulatory-index"
version = "0.1.0"
description = "POC of a structured AIFMD regulatory index (Level 1 + Level 2 + ESMA Level 3 + AMF doctrine)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "jinja2>=3.1.6",
    "langextract>=1.5.0",
    "lxml>=6.1.1",
    "networkx>=3.6.1",
    "openai>=2.41.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.3",
    "typer>=0.25.1",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
regindex = "regulatory_index.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulatory_index"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pyright]
# Pylance/pyright config — aligned with mypy strict semantics but tolerant of
# third-party libraries shipping partial type stubs (typer, langextract).
# Without this, Pylance flags every `typer.Option(...)` and `lx.extract(...)`
# call as "partially unknown" because their stubs return `Any` overloads.
include = ["src", "tests", "scripts"]
extraPaths = ["src", "scripts"]  # résout l'import des scripts (vocab_sync, classify_overrides) dans les tests
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Layout src/ : on garantit l'import du paquet même si l'install editable du .venv
# a dérivé (uv run peut le désinstaller au re-sync). Indépendant de l'état d'install.
# scripts/ : pour tester la logique des scripts (classify_overrides, vocab_sync…).
pythonpath = ["src", "scripts"]

[tool.uv]
# Use a system / pyenv-managed interpreter only — never download a uv-managed
# Python. Combined with `.python-version` (3.12.11), `uv` builds `.venv` from the
# pyenv install at ~/.pyenv/versions/3.12.11.
python-preference = "only-system"
