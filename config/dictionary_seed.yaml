# Feed dictionary_entry(type=theme) UNIQUEMENT (pas de table thème au v2 ;
# statement.theme_id référence souplement ces codes THM-*).
themes:
  - code: THM-GOV
    theme_name: Governance
    default_subtheme: Organisation
    description: Governance, organisational arrangements and management body responsibilities
  - code: THM-RISK
    theme_name: Risk Management
    default_subtheme: Risk framework
    description: Risk identification, measurement, management and monitoring
  - code: THM-LIQ
    theme_name: Liquidity
    default_subtheme: Liquidity management
    description: Liquidity systems, stress tests and redemption management
  - code: THM-VAL
    theme_name: Valuation
    default_subtheme: Asset valuation
    description: Valuation rules, NAV calculation and independence
  - code: THM-DEPO
    theme_name: Depositary & Custody
    default_subtheme: Depositary duties
    description: Depositary appointment, custody, oversight and liability
  - code: THM-DELEG
    theme_name: Delegation & Outsourcing
    default_subtheme: Delegation
    description: Delegation, outsourcing, due diligence and oversight of third parties
  - code: THM-REPORT
    theme_name: Transparency & Reporting
    default_subtheme: Regulatory reporting
    description: Investor disclosure, authority reporting and public reporting
  - code: THM-CONDUCT
    theme_name: Conduct of Business
    default_subtheme: Investor protection
    description: Conduct rules, fair treatment, marketing and order handling
  - code: THM-CONTROL
    theme_name: Compliance & Internal Control
    default_subtheme: Control framework
    description: Compliance arrangements, internal control and auditability
  - code: THM-AML
    theme_name: AML/CFT
    default_subtheme: KYC
    description: AML/CFT, KYC, sanctions and enhanced due diligence
