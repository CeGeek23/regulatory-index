# =============================================================================
#  Dictionnaire d'amorçage IRR v2 — seed du référentiel contrôlé (regindex 15)
# -----------------------------------------------------------------------------
#  Provenance  : modele_relationnel_raglogic_irr_v2.xlsx — onglet 15_dictionnaire
#  Version      : classeur v2 (« Dictionnaire minimal v1 »)
#  Converti le  : 2026-07-07 (conversion de données one-shot, l'Excel n'est plus lu)
#
#  Ce fichier est la SOURCE DE VÉRITÉ VERSIONNÉE du seed : `regindex dict seed`
#  le lit (jamais le .xlsx au runtime). Contenu VOLONTAIREMENT MINIMAL (mode
#  d'emploi client, bloc 2/5) : 20 acteurs, 30 actions, 30 objets, 10 types de
#  statements, 10 thèmes. Tout est ACTIF d'office (référentiel validé).
#
#  L'enrichissement (vocabulaires config/vocabularies/*.yaml, 303 acteurs du
#  glossaire consolidé) n'entre PAS ici : il est injecté séparément en CANDIDATS
#  inactifs à relire par `regindex dict candidates` (jamais actif d'office).
#
#  Mapping vers regindex (cf. docs/schema_relationnel.md § « Dictionnaire 04/05/06 + 15 ») :
#   - actors        -> dictionary_entry(type=actor)  + actor
#   - actions       -> dictionary_entry(type=action) + action
#   - objects       -> dictionary_entry(type=object) + regulatory_object
#   - statement_types -> dictionary_entry(type=statement_type) UNIQUEMENT
#                        (la contrainte runtime est la CHECK de statement.statement_type ;
#                         la forme minuscule y est attendue : STT-OBLIGATION -> 'obligation')
#   - themes        -> dictionary_entry(type=theme) UNIQUEMENT (pas de table thème au v2)
# =============================================================================

