# Controlled vocabulary of regulatory actors for AIFMD scope.
# Each entry must have a unique `id` (snake_case). The `canonical_*` fields are
# what the LangExtract schema will accept as canonical values. `aliases` are
# surface forms that should be recognised and mapped to canonical at extraction.
#
# Coverage: minimal v0 derived from AIFMD L1 + L2 + ESMA + AMF terminology.
# Expand iteratively; flag missing actors via `data/normalized/unmapped.csv`.

- id: aifm
  canonical_en: AIFM
  canonical_fr: Gestionnaire de FIA
  aliases: ["Alternative Investment Fund Manager", "AIF Manager", "Gestionnaire d'AIF", "Société de gestion AIFM"]
  legal_basis: "Directive 2011/61/EU Art. 4(1)(b)"

- id: ucits_manco
  canonical_en: UCITS ManCo
  canonical_fr: Société de gestion d'OPCVM
  aliases: ["UCITS Management Company", "ManCo", "société de gestion UCITS"]
  legal_basis: "Directive 2009/65/EC Art. 2(1)(b)"

