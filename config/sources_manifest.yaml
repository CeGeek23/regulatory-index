# Manifeste du corpus EUR-Lex — quels textes et quels articles conserver.
# Pilote la (re)construction hors-ligne du corpus (scripts/build_corpus_offline.py)
# à partir du HTML déjà en cache dans data/textes_sources/.
#
# Schéma :
#   source_id : doit correspondre à une entrée de sources_registry.yaml
#   celex / language : identifient le HTML en cache à parser
#   filter_articles : liste optionnelle de numéros d'article à conserver (sinon : tous)

- source_id: AIFMD_L1
  celex: "32011L0061"
  language: EN
  # 6-7-8 = chapitre II « Agrément » (bloc-pilote demandé par le client).
  # 15-16 = gestion des risques / liquidité ; 22-23 = chapitre Transparence.
  # Art 4 (Définitions) alimente le glossaire, pas l'extraction d'obligations.
  filter_articles: ["6", "7", "8", "15", "16", "22", "23"]

- source_id: AIFMD_L2
  celex: "32013R0231"
  language: EN
  filter_articles: ["38", "39", "40", "44", "47"]

- source_id: AIFMD_L1
  celex: "32011L0061"
  language: FR
  filter_articles: ["6", "7", "8", "15"]
