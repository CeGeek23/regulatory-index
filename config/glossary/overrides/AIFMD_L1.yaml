# Enrichissement relu à la main du glossaire AIFMD niveau 1 (Directive 2011/61/UE), article 4.
# Indexé par étiquette de point (a..ao). Chaque clé peut porter :
#   id    : identifiant snake_case (aligné sur les vocabulaires contrôlés quand le terme y existe)
#   type  : actor | investor | supervisor | concept   (schéma unique du projet : isole les acteurs
#           — actor/investor/supervisor — des concepts/objets — tout le reste ; cf. demande client)
#   cites : autres textes que la définition importe/vise (graphe inter-actes ; renvois d'origine
#           — pour la version à jour des renvois abrogés, cf. docs/level1_perimeter.md)
#   term_en / term_fr : à ne renseigner que si la détection automatique se trompe
#
# Sans ce fichier, le moissonnage reste générique : type via vocabulaires, cites via alias connus.

