# Décisions de classification (« tie-breaks ») — c'est ICI que se pose la relecture métier.
#
# Appliquées EN DERNIER par scripts/classify_overrides.py, elles font foi sur tout le corpus
# (au-dessus du modèle ET de l'harmonisation majoritaire). Un terme (libellé EN, casse/espaces
# ignorés) = un type unique parmi : actor | investor | supervisor | concept.
#
# Reproductible : corrige une ligne si tu n'es pas d'accord, puis relance `just classify-overrides`
# (ou avec --model <id> hors-ligne) — la décision est ré-appliquée à l'identique partout.
#
# Ci-dessous : les 14 termes que le petit modèle classait à parts égales selon les textes.
# Propositions établies par lecture des définitions OFFICIELLES (la définition substantielle, pas
# le renvoi) + vérification croisée. À confirmer/ajuster en relecture.

# — Concepts (notion / montant / activité), pas des personnes —
deposit: concept                 # DGSD : un solde créditeur à rembourser (montant), pas une entité
portfolio management: concept    # MiFID II : une activité/service de gestion, pas une personne

# — Investisseur (catégorie dédiée) —
investor: investor               # personne qui investit ; catégorie propre, distincte d'« actor »

# — Acteurs (entité / personne régulée qui agit) —
ancillary insurance intermediary: actor   # IDD : personne qui exerce la distribution d'assurance
consolidated tape provider: actor         # MiFID II : « person authorised to provide the service… »
eu parent financial holding company: actor # CRR : une financial holding company (personne morale)
eu parent institution: actor              # CRR : une parent institution (établissement régulé)
institution under resolution: actor       # BRRD : une institution/entité visée par une résolution
issuer: actor                             # MAR/MiCA : entité qui émet des instruments financiers
local firm: actor                         # CRR : une firme qui négocie pour compte propre
microenterprise: actor                    # DORA : « a financial entity which employs < 10 persons »
special purpose vehicle: actor            # Solvabilité II : un undertaking qui assume des risques
systematic internaliser: actor            # MiFID II : une entreprise d'investissement
third-country insurance undertaking: actor # Solvabilité II : une entreprise d'assurance
