# Registre des sources réglementaires pour le périmètre AIFMD.
# Utilisé par linking/citation_extractor.py pour résoudre les chaînes `cited_references`
# captées par LangExtract vers un source_id cible, sans aucune regex : le résolveur
# vérifie simplement si l'un des `aliases` apparaît (insensible à la casse) comme
# sous-chaîne de la citation.
#
# `level` et `issuer` sont utilisés par linking/graph_builder.py pour dériver le
# relation_type (clarifies / strengthens / operationalizes / interprets / references).

